<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucknow City Game</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #instructions {
        position: fixed;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="instructions">
      Welcome to Virtual Lucknow!<br><br>
      Controls:<br>
      WASD - Move<br>
      Mouse - Look around<br>
      Space - Jump<br><br>
      Click to start exploring
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
